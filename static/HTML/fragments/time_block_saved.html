{{range .}}

<div class="timeBlock{{.BlockID}} timeBlock" id="timeBlock{{.BlockID}}">
    <script src="/static/js/scheduler.js"></script>
    {{.BlockID}}
    <style>
        .timeBlock{{.BlockID}} {
            position:absolute;
            left:{{.Left}}px;
            width:40px;
            height:60px;
            background-color:blue;
            top:0px;
        }
    </style>
    </div>


    <script>
        {
            function updateSize() {
                console.log({{.BlockID}})
            const DAYS_OF_WEEK = [
                    "Mon",
                    "Tue",
                    "Wed",
                    "Thur",
                    "Fri",
                ]
            const schedule = document.getElementById("scheduleGraph");
            const increments = 10;

            // const incrementDistance = schedule.offsetWidth/(-(8-18) * 60/increments); //This would be from 8 to 6 (60 minutes to the hout) and 10 minute increments
            // const dayDistance = schedule.offsetHeight/(5); //5 days a week

            let block = document.getElementById("timeBlock{{.BlockID}}")
            block.style.height = `${window.dayDistance}px`;
            block.style.top = `${window.dayDistance * window.DAYS_OF_WEEK.indexOf("{{.DayOfWeek}}")}px`;
            console.log("{{.DayOfWeek}}");
            let durationStr = "{{.Duration}}";

            let [hours, minutes] = durationStr.split(":").map(Number);
            block.style.width = `${((hours*60 + minutes)/increments)*window.incrementDistance}px`;
            }

            updateSize()

            window.addEventListener("resize", updateSize)
            
        }
    </script>
    </div>
</div>

{{end}}
